name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-core
            os: ubuntu-latest
            packages: zlib1g-dev
            configure: -DUIFE_ENABLE_LIBTSK=OFF -DUIFE_ENABLE_LIBEWF=OFF -DUIFE_ENABLE_LIBWIM=OFF
          - name: linux-optional-backends
            os: ubuntu-latest
            # 可选依赖安装失败不应阻断构建：缺少后端时 UIFE 自动降级为“仅识别”。
            packages: zlib1g-dev libtsk-dev libewf-dev libwim-dev
            optional_packages: true
            configure: ""
          - name: macos-core
            os: macos-latest
            packages: ""
            configure: -DUIFE_ENABLE_LIBTSK=OFF -DUIFE_ENABLE_LIBEWF=OFF -DUIFE_ENABLE_LIBWIM=OFF
          - name: windows-msvc-core
            os: windows-latest
            packages: ""
            # runner 镜像不带 zlib 开发文件；DMG/GHO 解压依赖 zlib，因此用镜像
            # 预装的 vcpkg 装一份，避免配置阶段 find_package(ZLIB) 直接失败。
            vcpkg: zlib:x64-windows
            configure: -DUIFE_ENABLE_LIBTSK=OFF -DUIFE_ENABLE_LIBEWF=OFF -DUIFE_ENABLE_LIBWIM=OFF

    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies (Debian/Ubuntu)
        if: runner.os == 'Linux' && matrix.packages != ''
        shell: bash
        run: |
          sudo apt-get update
          if [ "${{ matrix.optional_packages }}" = "true" ]; then
            sudo apt-get install -y ${{ matrix.packages }} || echo "可选后端安装失败，按仅识别模式继续构建"
          else
            sudo apt-get install -y ${{ matrix.packages }}
          fi

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS' && matrix.packages != ''
        shell: bash
        run: brew install ${{ matrix.packages }}

      - name: Install dependencies (Windows, vcpkg)
        if: runner.os == 'Windows' && matrix.vcpkg != ''
        shell: pwsh
        run: |
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install ${{ matrix.vcpkg }} --triplet x64-windows

      - name: Configure (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_FLAGS="-Wall -Wextra" ${{ matrix.configure }}

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # 注意：工具链参数必须以数组展开成多个独立参数；若拼成一个字符串，
          # CMake 会把 "-DVCPKG_TARGET_TRIPLET=..." 也当成工具链文件路径的一部分。
          # 不指定 -G：runner 镜像已升级到 VS 2026，硬编码 "Visual Studio 17 2022"
          # 会报 "could not find any instance of Visual Studio"，让 CMake 自动选择。
          $toolchain = @()
          if ("${{ matrix.vcpkg }}" -ne "") {
            $root = $env:VCPKG_INSTALLATION_ROOT
            $toolchain += "-DCMAKE_TOOLCHAIN_FILE=$root/scripts/buildsystems/vcpkg.cmake"
            $toolchain += "-DVCPKG_TARGET_TRIPLET=x64-windows"
          }
          cmake -S . -B build ${{ matrix.configure }} @toolchain

      - name: Dump CMake probe errors
        # check_cxx_source_compiles 失败的编译细节只落在 CMakeError.log 里；
        # 这里直接打印，避免后端探测失败时无从诊断。
        if: matrix.optional_packages
        shell: bash
        run: |
          if [ -f build/CMakeFiles/CMakeError.log ]; then
            sed -n '1,300p' build/CMakeFiles/CMakeError.log
          else
            echo "no CMakeError.log (all probes passed)"
          fi

      - name: Verify optional backends were actually enabled
        # optional_packages 允许安装失败后继续，因此这条任务曾经可能在“一个后端都没装上”
        # 的情况下依旧显示绿色。这里把真的启用情况读回来，缺一个就失败。
        if: matrix.optional_packages
        shell: bash
        run: |
          cat build/uife-backends.txt
          missing=0
          for backend in libtsk libewf libwim; do
            if ! grep -q "$backend=ON" build/uife-backends.txt; then
              echo "::error::$backend was not enabled even though the job claims optional backends"
              missing=1
            fi
          done
          exit $missing

      - name: Build (Unix)
        if: runner.os != 'Windows'
        shell: bash
        # 保留构建日志，失败时由下一步转成 annotation（无需下载完整日志即可诊断）
        run: |
          set -o pipefail
          cmake --build build --parallel 2>&1 | tee build/build.log

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cmake --build build --config Release --parallel 2>&1 |
            Tee-Object -FilePath build/build.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Summarize build errors
        # 把编译错误逐条转成 annotation：GitHub 会把它显示在运行页面上，
        # 分析 CI 时无需下载完整日志压缩包。
        if: failure()
        shell: bash
        run: |
          if [ ! -f build/build.log ]; then
            echo "::error::build/build.log 不存在（失败发生在构建之前，检查 Configure 步骤）"
            exit 0
          fi
          grep -n -E "error:|error C[0-9]+|fatal error|undefined reference" build/build.log \
            | head -15 | while IFS= read -r line; do
              echo "::error::$line"
            done

      - name: Test (Unix)
        if: runner.os != 'Windows'
        shell: bash
        # tee 保存 ctest 控制台输出，供失败时的注解步骤提取测试输出；
        # pipefail 保证退出码仍是 ctest 的，不会被 tee 覆盖。
        env:
          UIFE_SWEEP_REPORT: ${{ github.workspace }}/build/sweep-report.txt
        run: |
          set -o pipefail
          ctest --test-dir build --output-on-failure 2>&1 | tee build/test.log

      - name: Test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          UIFE_SWEEP_REPORT: ${{ github.workspace }}/build/sweep-report.txt
        run: |
          ctest --test-dir build -C Release --output-on-failure 2>&1 | Tee-Object -FilePath build/test.log
          exit $LASTEXITCODE

      - name: Report sweep coverage
        # ctest 在用例通过时吞掉进程输出，所以清扫自己把用例数写进报告文件。
        # 这里把它打到日志与 job summary，覆盖率数字才可审计（防"其实一个用例都没跑"）。
        if: always()
        shell: bash
        run: |
          report=build/sweep-report.txt
          if [ ! -f "$report" ]; then
            echo "::warning::no sweep report was written — the invariant sweeps did not run"
            exit 0
          fi
          cat "$report"
          {
            echo '### Invariant sweep coverage'
            echo '```'
            cat "$report"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Summarize test failures
        # 与 "Summarize build errors" 互补：那一步只覆盖编译错误且位置在 Build 之后，
        # 这里把 ctest 的失败用例与输出段转成 annotation，运行页面上即可读到。
        if: failure()
        shell: bash
        run: |
          log=build/test.log
          if [ ! -f "$log" ]; then
            echo "::error::build/test.log 不存在（失败发生在测试之前）"
            exit 0
          fi
          # 用例结果行：一行一个 annotation
          grep -E "^[[:space:]]*[0-9]+/[0-9]+ Test #|The following tests FAILED" "$log" \
            | head -10 | while IFS= read -r line; do
              echo "::error::$line"
            done
          # 首个失败/崩溃用例的输出（ctest --output-on-failure 紧跟在结果行之后）；
          # 异常终止（***Exception）同样要抓，否则只能看到退出码。
          detail=$(awk '/\*\*\*(Failed|Exception|Timeout|SEGFAULT)/{flag=1} flag' "$log" | head -40)
          if [ -n "$detail" ]; then
            body=$(printf '%s' "$detail" | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error::failed test output:${body}"
          fi

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.name }}-test-logs
          path: |
            build/build.log
            build/test.log
            build/sweep-report.txt
            build/Testing/Temporary/LastTest.log
            build/CMakeFiles/CMakeError.log
            build/uife-backends.txt
            build/compat-matrix.md
            build/compat-matrix.json
          if-no-files-found: ignore
          retention-days: 7

  # 用 ASan/UBSan 重跑同一套测试：崩溃会被普通构建抓到，但"读越界一个字节、
  # 有符号溢出、空指针解引用"这类问题在 Release 下往往静默通过。取证工具解析的是
  # 不可信镜像，畸形输入清扫里那几百个变异用例只有配 sanitizer 才有真实威力。
  linux-sanitizers:
    name: linux-sanitizers
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y zlib1g-dev ninja-build

      - name: Configure (ASan + UBSan)
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DUIFE_SANITIZE=ON \
            -DUIFE_ENABLE_LIBTSK=OFF -DUIFE_ENABLE_LIBEWF=OFF -DUIFE_ENABLE_LIBWIM=OFF

      - name: Build
        # pipefail 必须显式打开：否则管道的退出码取自 tee，编译失败会被吞掉。
        run: |
          set -o pipefail
          mkdir -p build
          cmake --build build --parallel 2>&1 | tee build/build.log

      - name: Test (sanitizers halt on first error)
        env:
          # 关注越界、use-after-free 与未定义行为；泄漏检测先关掉——静态单例与
          # 测试脚手架的可达对象容易产生噪声，把信号淹掉。等这套跑稳了再单独开。
          ASAN_OPTIONS: detect_leaks=0:abort_on_error=1:strict_string_checks=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
          UIFE_SWEEP_REPORT: ${{ github.workspace }}/build/sweep-report.txt
        run: |
          set -o pipefail
          mkdir -p build
          ctest --test-dir build --output-on-failure --timeout 600 2>&1 | tee build/test.log

      - name: Report sweep coverage
        if: always()
        shell: bash
        run: |
          report=build/sweep-report.txt
          if [ ! -f "$report" ]; then
            echo "::warning::no sweep report was written — the invariant sweeps did not run"
            exit 0
          fi
          cat "$report"
          {
            echo '### Invariant sweep coverage (ASan + UBSan)'
            echo '```'
            cat "$report"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Summarize sanitizer findings
        if: failure()
        shell: bash
        run: |
          log=build/test.log
          [ -f "$log" ] || log=build/Testing/Temporary/LastTest.log
          detail=$(awk '/ERROR: AddressSanitizer|runtime error:|SUMMARY: (AddressSanitizer|UndefinedBehaviorSanitizer)|\*\*\*(Failed|Exception|SEGFAULT)/{flag=1} flag' "$log" | head -45)
          if [ -n "$detail" ]; then
            body=$(printf '%s' "$detail" | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error::sanitizer finding:${body}"
          else
            echo "::error::sanitizer job failed without a recognizable report; see artifacts"
          fi

      - name: Upload sanitizer logs
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: linux-sanitizers-logs
          path: |
            build/build.log
            build/test.log
            build/sweep-report.txt
            build/Testing/Temporary/LastTest.log
          if-no-files-found: ignore
          retention-days: 7

  # Windows 上的"全后端"无法用 MSVC 实现：sleuthkit、libyal 系列（libewf /
  # libfsapfs / libfsrefs）、wimlib 都没有 vcpkg 或 MSYS2 端口，MSVC 版需要先移植
  # 它们各自的构建系统。因此这条任务改用 MinGW-w64 (UCRT64) + 预编译依赖包，
  # 把"Windows 上真后端可用"纳入 CI 保护；MSVC 那条继续负责核心功能的 ABI 覆盖。
  windows-mingw-full:
    name: windows-mingw-full
    runs-on: windows-latest
    # 首次运行要下 260MB 工具链、建 1.5GB 缓存，余量留给缓存写入
    timeout-minutes: 40
    env:
      # 依赖包由 scripts/package-deps.ps1 生成，挂在 Release 资产上（14MB）。
      UIFE_DEPS_URL: https://github.com/${{ github.repository }}/releases/download/deps-mingw-ucrt64/uife-deps-mingw-ucrt64.zip
      MINGW_ROOT: C:\toolchains\mingw64
    steps:
      - uses: actions/checkout@v5

      - name: Cache MinGW toolchain
        id: mingw
        uses: actions/cache@v6
        with:
          path: C:\toolchains\mingw64
          key: winlibs-16.2.0-ucrt-posix-seh-r3

      - name: Install MinGW toolchain (WinLibs, pinned)
        # 必须与依赖包 manifest.json 里的编译器一致（gcc 16.2.0 / UCRT / POSIX / SEH），
        # 否则静态库的 C++ ABI 对不上，链接阶段才会炸。
        if: steps.mingw.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $url = "https://github.com/brechtsanders/winlibs_mingw/releases/download/16.2.0posix-23.1.3-14.0.0-ucrt-r3/winlibs-x86_64-posix-seh-gcc-16.2.0-mingw-w64ucrt-14.0.0-r3.zip"
          $stage = "C:\toolchains\_unpack"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          $zip = "$env:RUNNER_TEMP\winlibs.zip"
          Invoke-WebRequest -Uri $url -OutFile $zip
          # 归档约 260MB；下载被截断时让失败原因明确指向网络，而不是后面的解包
          $size = (Get-Item $zip).Length
          if ($size -lt 200MB) {
            Write-Host "::error::winlibs archive looks truncated: $size bytes"
            exit 1
          }
          # bsdtar 解大 zip 比 Expand-Archive 快一个数量级（老 runner 没有 tar.exe，
          # 因此保留回退路径）
          if (Get-Command tar -ErrorAction SilentlyContinue) {
            tar -xf $zip -C $stage
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } else {
            Expand-Archive -LiteralPath $zip -DestinationPath $stage
          }
          # winlibs 归档的顶层目录本身就是 mingw 根（mingw64/），但不同 release 可能多/少
          # 一层包装，所以不猜层级：按 bin\g++.exe 反推工具链根再归一到 MINGW_ROOT。
          $gpp = Get-ChildItem $stage -Recurse -Depth 3 -Filter g++.exe -File -ErrorAction SilentlyContinue `
            | Where-Object { $_.Directory.Name -eq "bin" } | Select-Object -First 1
          if (-not $gpp) {
            Write-Host "::error::g++.exe not found inside the winlibs archive"
            exit 1
          }
          $mingw = $gpp.Directory.Parent.FullName
          if (Test-Path $env:MINGW_ROOT) { Remove-Item $env:MINGW_ROOT -Recurse -Force }
          Move-Item -LiteralPath $mingw -Destination $env:MINGW_ROOT
          Remove-Item $stage -Recurse -Force
          & "$env:MINGW_ROOT\bin\g++.exe" --version | Select-Object -First 1

      - name: Fetch prebuilt dependency bundle
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path deps | Out-Null
          Invoke-WebRequest -Uri $env:UIFE_DEPS_URL -OutFile "deps\uife-deps-mingw-ucrt64.zip"
          # 校验和写在 deps/MANIFEST.md：下载被截断或资产被误替换时立刻失败，
          # 而不是等到链接阶段报一堆 undefined reference。
          $expected = "25f6e01fcba37f35997e444383a9d709d8c21b0abd8689d55804852d7d12a538"
          $actual = (Get-FileHash -Path "deps\uife-deps-mingw-ucrt64.zip" -Algorithm SHA256).Hash.ToLower()
          if ($actual -ne $expected) {
            Write-Host "::error::dependency bundle checksum mismatch: got $actual, expected $expected"
            exit 1
          }
          & pwsh -NoProfile -ExecutionPolicy Bypass -File scripts\fetch-deps.ps1 -CompilerPath "$env:MINGW_ROOT\bin\g++.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Put MinGW (and wimlib DLL) on PATH
        shell: pwsh
        run: |
          # 缓存命中时也要校验：缓存的目录结构要是变了（或缓存被写坏），
          # 这里立刻报出可操作的错误，而不是让后面的 configure 以奇怪的方式失败。
          if (-not (Test-Path "$env:MINGW_ROOT\bin\g++.exe")) {
            Write-Host "::error::MinGW toolchain missing at $env:MINGW_ROOT; remove the toolchain cache (key winlibs-16.2.0-ucrt-posix-seh-r3) and re-run"
            exit 1
          }
          & "$env:MINGW_ROOT\bin\g++.exe" --version | Select-Object -First 1
          Add-Content -Path $env:GITHUB_PATH -Value "$env:MINGW_ROOT\bin"
          Add-Content -Path $env:GITHUB_PATH -Value "${{ github.workspace }}\deps\sdk\wimlib\lib"

      - name: Configure (MinGW, all backends)
        shell: pwsh
        run: |
          if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) {
            choco install ninja -y --no-progress
          }
          cmake -S . -B build -G Ninja -C deps/uife-deps.cmake `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++ `
            -DUIFE_ENABLE_LIBTSK=ON -DUIFE_ENABLE_LIBEWF=ON -DUIFE_ENABLE_LIBWIM=ON `
            -DUIFE_ENABLE_LIBFSAPFS=ON -DUIFE_ENABLE_LIBFSREFS=ON
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify all backends were enabled
        # 与 linux-optional-backends 同理：不能让"依赖没解析到、后端全关掉"也显示绿色。
        shell: pwsh
        run: |
          Get-Content build/uife-backends.txt
          $state = Get-Content build/uife-backends.txt -Raw
          $missing = 0
          foreach ($backend in @("libtsk", "libewf", "libwim", "libfsapfs", "libfsrefs")) {
            if ($state -notmatch "$backend=ON") {
              Write-Host "::error::$backend was not enabled in the MinGW build"
              $missing = 1
            }
          }
          if ($missing -ne 0) { exit 1 }

      - name: Build
        shell: pwsh
        run: |
          cmake --build build --parallel 2>&1 | Tee-Object -FilePath build/build.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Test
        shell: pwsh
        env:
          UIFE_SWEEP_REPORT: ${{ github.workspace }}/build/sweep-report.txt
        run: |
          ctest --test-dir build --output-on-failure 2>&1 | Tee-Object -FilePath build/test.log
          exit $LASTEXITCODE

      - name: Report sweep coverage
        if: always()
        shell: bash
        run: |
          report=build/sweep-report.txt
          if [ ! -f "$report" ]; then
            echo "::warning::no sweep report was written — the invariant sweeps did not run"
            exit 0
          fi
          cat "$report"
          {
            echo '### Invariant sweep coverage (all backends)'
            echo '```'
            cat "$report"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Summarize failures
        # 与矩阵任务的 "Summarize build/test failures" 等价，只是合并成一步：
        # 编译错误和失败用例都转成 annotation，无需下载日志压缩包。
        if: failure()
        shell: bash
        run: |
          if [ -f build/build.log ]; then
            grep -n -E "error:|error C[0-9]+|fatal error|undefined reference" build/build.log \
              | head -10 | while IFS= read -r line; do
                echo "::error::build: $line"
              done
          fi
          if [ -f build/test.log ]; then
            grep -E "^[[:space:]]*[0-9]+/[0-9]+ Test #|The following tests FAILED" build/test.log \
              | head -10 | while IFS= read -r line; do
                echo "::error::${line}"
              done
            detail=$(awk '/\*\*\*(Failed|Exception|Timeout|SEGFAULT)/{flag=1} flag' build/test.log | head -40)
            if [ -n "$detail" ]; then
              body=$(printf '%s' "$detail" | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')
              echo "::error::failed test output:${body}"
            fi
          fi

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: windows-mingw-full-test-logs
          path: |
            build/build.log
            build/test.log
            build/sweep-report.txt
            build/Testing/Temporary/LastTest.log
            build/uife-backends.txt
          if-no-files-found: ignore
          retention-days: 7

  # 真实样本兼容性矩阵。外部证据语料体积大、含敏感数据，不能进版本库，所以
  # 这里走两条路：
  #   1) 每次提交都用 scripts/gen-corpus.py 生成的确定性小语料（几 MB，纯 Python
  #      构造，不依赖任何外部工具），保证矩阵真的有回归保护；
  #   2) 仓库变量 UIFE_CORPUS_DIR 指向受控证据目录时，再跑一遍真实语料。
  # 生成用例数不足直接失败——不允许"一个用例都没生成"也算绿色。
  compat-matrix:
    name: compat-matrix
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      UIFE_EXTERNAL_CORPUS: ${{ vars.UIFE_CORPUS_DIR }}
    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies
        shell: bash
        run: |
          sudo apt-get update
          # 后端库是硬依赖：没有 libtsk/libewf，矩阵里所有 list/extract 都只会报错。
          sudo apt-get install -y zlib1g-dev libtsk-dev libewf-dev libwim-dev
          # 语料生成工具是可选的，缺一个只是少几个用例（必需用例由纯 Python 生成）。
          sudo apt-get install -y ewf-tools e2fsprogs xorriso || true

      - name: Configure
        shell: bash
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Verify all backends were enabled
        # 与 linux-optional-backends 同理：后端悄悄全关掉时矩阵会"全绿但什么都没测"。
        shell: bash
        run: |
          cat build/uife-backends.txt
          missing=0
          for backend in libtsk libewf libwim; do
            if ! grep -q "$backend=ON" build/uife-backends.txt; then
              echo "::error::$backend was not enabled; the compatibility matrix would be meaningless"
              missing=1
            fi
          done
          exit $missing

      - name: Build
        shell: bash
        run: |
          set -o pipefail
          cmake --build build --parallel 2>&1 | tee build/build.log

      - name: Generate CI corpus
        shell: bash
        run: |
          python3 scripts/gen-corpus.py --output build/corpus --clean
          count=$(find build/corpus -name expect.json | wc -l)
          echo "生成的用例数: $count"
          if [ "$count" -lt 5 ]; then
            echo "::error::only $count corpus cases were generated; the matrix would not cover anything"
            exit 1
          fi

      - name: Run compatibility matrix (generated corpus)
        shell: bash
        run: |
          python3 tests/compat_matrix.py \
            --exe build/uife \
            --corpus build/corpus \
            --report build/compat-matrix.md \
            --json build/compat-matrix.json

      - name: Run compatibility matrix (external corpus)
        # 只有配置了证据语料目录时才跑；语料放在受控位置，不进版本库。
        if: env.UIFE_EXTERNAL_CORPUS != ''
        shell: bash
        run: |
          python3 tests/compat_matrix.py \
            --exe build/uife \
            --corpus "$UIFE_EXTERNAL_CORPUS" \
            --report build/compat-matrix-external.md \
            --json build/compat-matrix-external.json

      - name: Summarize matrix
        if: always()
        shell: bash
        run: |
          for report in build/compat-matrix.md build/compat-matrix-external.md; do
            [ -f "$report" ] || continue
            {
              echo "### $(basename "$report")"
              echo '```'
              cat "$report"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Summarize failures
        if: failure()
        shell: bash
        run: |
          if [ -f build/build.log ]; then
            grep -n -E "error:|fatal error|undefined reference" build/build.log \
              | head -10 | while IFS= read -r line; do echo "::error::build: $line"; done
          fi
          for report in build/compat-matrix.md build/compat-matrix-external.md; do
            [ -f "$report" ] || continue
            grep -E "^\| .*失败|❌|失败" "$report" | head -15 \
              | while IFS= read -r line; do echo "::error::$(basename "$report"): $line"; done
          done

      - name: Upload matrix report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: compat-matrix
          path: |
            build/compat-matrix.md
            build/compat-matrix.json
            build/compat-matrix-external.md
            build/compat-matrix-external.json
            build/build.log
          if-no-files-found: ignore
          retention-days: 30
