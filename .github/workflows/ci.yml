name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-core
            os: ubuntu-latest
            packages: zlib1g-dev
            configure: -DUIFE_ENABLE_LIBTSK=OFF -DUIFE_ENABLE_LIBEWF=OFF -DUIFE_ENABLE_LIBWIM=OFF
          - name: linux-optional-backends
            os: ubuntu-latest
            # 可选依赖安装失败不应阻断构建：缺少后端时 UIFE 自动降级为“仅识别”。
            packages: zlib1g-dev libtsk-dev libewf-dev libwim-dev
            optional_packages: true
            configure: ""
          - name: macos-core
            os: macos-latest
            packages: ""
            configure: -DUIFE_ENABLE_LIBTSK=OFF -DUIFE_ENABLE_LIBEWF=OFF -DUIFE_ENABLE_LIBWIM=OFF
          - name: windows-msvc-core
            os: windows-latest
            packages: ""
            # runner 镜像不带 zlib 开发文件；DMG/GHO 解压依赖 zlib，因此用镜像
            # 预装的 vcpkg 装一份，避免配置阶段 find_package(ZLIB) 直接失败。
            vcpkg: zlib:x64-windows
            configure: -DUIFE_ENABLE_LIBTSK=OFF -DUIFE_ENABLE_LIBEWF=OFF -DUIFE_ENABLE_LIBWIM=OFF

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies (Debian/Ubuntu)
        if: runner.os == 'Linux' && matrix.packages != ''
        shell: bash
        run: |
          sudo apt-get update
          if [ "${{ matrix.optional_packages }}" = "true" ]; then
            sudo apt-get install -y ${{ matrix.packages }} || echo "可选后端安装失败，按仅识别模式继续构建"
          else
            sudo apt-get install -y ${{ matrix.packages }}
          fi

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS' && matrix.packages != ''
        shell: bash
        run: brew install ${{ matrix.packages }}

      - name: Install dependencies (Windows, vcpkg)
        if: runner.os == 'Windows' && matrix.vcpkg != ''
        shell: pwsh
        run: |
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install ${{ matrix.vcpkg }} --triplet x64-windows

      - name: Configure (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_FLAGS="-Wall -Wextra" ${{ matrix.configure }}

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # 注意：工具链参数必须以数组展开成多个独立参数；若拼成一个字符串，
          # CMake 会把 "-DVCPKG_TARGET_TRIPLET=..." 也当成工具链文件路径的一部分。
          # 不指定 -G：runner 镜像已升级到 VS 2026，硬编码 "Visual Studio 17 2022"
          # 会报 "could not find any instance of Visual Studio"，让 CMake 自动选择。
          $toolchain = @()
          if ("${{ matrix.vcpkg }}" -ne "") {
            $root = $env:VCPKG_INSTALLATION_ROOT
            $toolchain += "-DCMAKE_TOOLCHAIN_FILE=$root/scripts/buildsystems/vcpkg.cmake"
            $toolchain += "-DVCPKG_TARGET_TRIPLET=x64-windows"
          }
          cmake -S . -B build ${{ matrix.configure }} @toolchain

      - name: Dump CMake probe errors
        # check_cxx_source_compiles 失败的编译细节只落在 CMakeError.log 里；
        # 这里直接打印，避免后端探测失败时无从诊断。
        if: matrix.optional_packages
        shell: bash
        run: |
          if [ -f build/CMakeFiles/CMakeError.log ]; then
            sed -n '1,300p' build/CMakeFiles/CMakeError.log
          else
            echo "no CMakeError.log (all probes passed)"
          fi

      - name: Verify optional backends were actually enabled
        # optional_packages 允许安装失败后继续，因此这条任务曾经可能在“一个后端都没装上”
        # 的情况下依旧显示绿色。这里把真的启用情况读回来，缺一个就失败。
        if: matrix.optional_packages
        shell: bash
        run: |
          cat build/uife-backends.txt
          missing=0
          for backend in libtsk libewf libwim; do
            if ! grep -q "$backend=ON" build/uife-backends.txt; then
              echo "::error::$backend was not enabled even though the job claims optional backends"
              missing=1
            fi
          done
          exit $missing

      - name: Build (Unix)
        if: runner.os != 'Windows'
        shell: bash
        # 保留构建日志，失败时由下一步转成 annotation（无需下载完整日志即可诊断）
        run: |
          set -o pipefail
          cmake --build build --parallel 2>&1 | tee build/build.log

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cmake --build build --config Release --parallel 2>&1 |
            Tee-Object -FilePath build/build.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Summarize build errors
        # 把编译错误逐条转成 annotation：GitHub 会把它显示在运行页面上，
        # 分析 CI 时无需下载完整日志压缩包。
        if: failure()
        shell: bash
        run: |
          if [ ! -f build/build.log ]; then
            echo "::error::build/build.log 不存在（失败发生在构建之前，检查 Configure 步骤）"
            exit 0
          fi
          grep -n -E "error:|error C[0-9]+|fatal error|undefined reference" build/build.log \
            | head -15 | while IFS= read -r line; do
              echo "::error::$line"
            done

      - name: Test (Unix)
        if: runner.os != 'Windows'
        shell: bash
        # tee 保存 ctest 控制台输出，供失败时的注解步骤提取测试输出；
        # pipefail 保证退出码仍是 ctest 的，不会被 tee 覆盖。
        run: |
          set -o pipefail
          ctest --test-dir build --output-on-failure 2>&1 | tee build/test.log

      - name: Test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ctest --test-dir build -C Release --output-on-failure 2>&1 | Tee-Object -FilePath build/test.log
          exit $LASTEXITCODE

      - name: Summarize test failures
        # 与 "Summarize build errors" 互补：那一步只覆盖编译错误且位置在 Build 之后，
        # 这里把 ctest 的失败用例与输出段转成 annotation，运行页面上即可读到。
        if: failure()
        shell: bash
        run: |
          log=build/test.log
          if [ ! -f "$log" ]; then
            echo "::error::build/test.log 不存在（失败发生在测试之前）"
            exit 0
          fi
          # 用例结果行：一行一个 annotation
          grep -E "^[[:space:]]*[0-9]+/[0-9]+ Test #|The following tests FAILED" "$log" \
            | head -10 | while IFS= read -r line; do
              echo "::error::$line"
            done
          # 首个失败用例的输出（ctest --output-on-failure 紧跟在结果行之后）
          detail=$(awk '/\*\*\*Failed/{flag=1} flag' "$log" | head -40)
          if [ -n "$detail" ]; then
            body=$(printf '%s' "$detail" | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error::failed test output:${body}"
          fi

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}-test-logs
          path: |
            build/build.log
            build/test.log
            build/Testing/Temporary/LastTest.log
            build/CMakeFiles/CMakeError.log
            build/uife-backends.txt
            build/compat-matrix.md
            build/compat-matrix.json
          if-no-files-found: ignore
          retention-days: 7

  # 真实样本兼容性矩阵需要外部证据语料，只有在仓库配置了语料（自托管 runner
  # 或预先下载的 artifact）时才有意义，因此默认不随每次提交运行。
  # 手动触发时可在仓库变量 UIFE_CORPUS_DIR 中给出语料路径。
  compat-matrix:
    if: github.event_name == 'workflow_dispatch' && vars.UIFE_CORPUS_DIR != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y zlib1g-dev
      - name: Build
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --parallel
      - name: Run compatibility matrix
        run: |
          python3 tests/compat_matrix.py \
            --exe build/uife \
            --corpus "${{ vars.UIFE_CORPUS_DIR }}" \
            --report build/compat-matrix.md \
            --json build/compat-matrix.json
      - name: Upload matrix report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compat-matrix
          path: |
            build/compat-matrix.md
            build/compat-matrix.json
          retention-days: 30
